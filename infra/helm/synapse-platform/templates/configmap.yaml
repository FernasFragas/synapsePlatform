apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synapse-platform.fullname" . }}-config
  labels:
    {{- include "synapse-platform.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      address: {{ .Values.server.address | default ":8080" | quote }}
      timeouts:
        read_header: {{ .Values.server.timeouts.readHeader | default "5s" | quote }}
        read: {{ .Values.server.timeouts.read | default "10s" | quote }}
        write: {{ .Values.server.timeouts.write | default "30s" | quote }}
        idle: {{ .Values.server.timeouts.idle | default "120s" | quote }}
      shutdown:
        timeout: {{ .Values.server.shutdown.timeout | default "10s" | quote }}
        grace_period: {{ .Values.server.shutdown.gracePeriod | default "5s" | quote }}
      cors:
        allowed_origins:
          {{- range .Values.server.cors.allowedOrigins }}
          - {{ . | quote }}
          {{- end }}
      rate_limit:
        requests_per_second: {{ .Values.server.rateLimit.requestsPerSecond | default 10 }}
        burst: {{ .Values.server.rateLimit.burst | default 20 }}

    auth:
      jwt:
        issuer: {{ .Values.auth.jwt.issuer | quote }}
        audience: {{ .Values.auth.jwt.audience | quote }}
        secret: ""

    kafka:
      brokers:
        {{- range .Values.kafka.brokers }}
        - {{ . | quote }}
        {{- end }}
      group_id: {{ .Values.kafka.groupID | quote }}
      topics:
        {{- range .Values.kafka.topics }}
        - {{ . | quote }}
        {{- end }}
      dlq_topic: {{ .Values.kafka.dlqTopic | quote }}
      min_bytes: {{ .Values.kafka.minBytes | default 100000 }}
      max_bytes: {{ .Values.kafka.maxBytes | default 100000000 }}

    llm:
      enabled: {{ .Values.llm.enabled }}
      host: {{ .Values.llm.host | quote }}
      model: {{ .Values.llm.model | quote }}
      timeout: {{ .Values.llm.timeout | default "60s" | quote }}
      max_tokens: {{ .Values.llm.maxTokens | default 512 }}
      temperature: {{ .Values.llm.temperature | default 0.2 }}

    database:
      path: {{ .Values.database.path | quote }}

    log:
      redact_keys:
        {{- range .Values.log.redactKeys }}
        - {{ . | quote }}
        {{- end }}
      max_value_bytes: {{ .Values.log.maxValueBytes | default 512 }}

    tracing:
      endpoint: {{ .Values.tracing.endpoint | default "" | quote }}