apiVersion: v1
kind: Service
metadata:
  name: {{ include "synapse-platform.fullname" . }}
  labels:
      {{- include "synapse-platform.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default .Values.service.port }}
      protocol: TCP
        {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
        {{- end }}
  selector:
      {{- include "synapse-platform.selectorLabels" . | nindent 4 }}