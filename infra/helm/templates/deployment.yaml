replicaCount: 2
image:
  repository: synapse-platform
  tag: "0.1.0"
  pullPolicy: IfNotPresent
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

kafka:
  enabled: true
  brokers:
    - kafka:9092
  topics:
    - events
  dlqTopic: events-dlq

llm:
  enabled: false
  host: "http://ollama:11434"
  model: "llama3"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  hosts: []
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1
  
observability:
  serviceMonitor:
    enabled: false

health:
  readinessPath: /readyz
  livenessPath: /livez
  startupPath: /startupz